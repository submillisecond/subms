name: ci

on:
  push:
    branches: [main]
  pull_request:

# Each language side runs in its own job so a Rust regression doesn't mask
# a Java one and vice versa. Both must be green before merge.
#
# Every gate runs with continue-on-error and the summary step runs with
# `if: always()`, so a red run still documents itself: which gate failed,
# which test by name, and the assertion message. The summary action is what
# turns a red gate back into a red job - it exits non-zero on anything red.
#
# The summary generator is shared across the org and lives in
# submillisecond/subms-actions (scripts/ci-summary). TODO: pin to @v0 once the
# floating tag carries it.

permissions:
  contents: read

jobs:
  rust:
    name: rust (cargo test + clippy + fmt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        id: fmt
        continue-on-error: true
        run: cargo fmt --check

      - name: cargo clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `shell: bash` is deliberate: it runs with `-o pipefail`, so cargo's exit
      # status survives the pipe into tee. The default shell does not, and the
      # step would go green on a red test run.
      - name: cargo test (no features)
        id: test_nodefault
        continue-on-error: true
        shell: bash
        run: cargo test --no-default-features 2>&1 | tee ../ci-rust-no-default-features.log

      - name: cargo test (all features)
        id: test_allfeatures
        continue-on-error: true
        shell: bash
        run: cargo test --all-features 2>&1 | tee ../ci-rust-all-features.log

      - name: cargo doc
        id: doc
        continue-on-error: true
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Run summary
        if: always()
        uses: submillisecond/subms-actions/scripts/ci-summary@main
        with:
          title: "subms - Rust (stable)"
          gates: |
            cargo fmt --check=${{ steps.fmt.outcome }}
            cargo clippy -D warnings=${{ steps.clippy.outcome }}
            cargo test --no-default-features=${{ steps.test_nodefault.outcome }}
            cargo test --all-features=${{ steps.test_allfeatures.outcome }}
            cargo doc (RUSTDOCFLAGS=-D warnings)=${{ steps.doc.outcome }}
          cargo-test-logs: |
            no-default-features=ci-rust-no-default-features.log
            all-features=ci-rust-all-features.log
          tarpaulin: |
            rust (tarpaulin)=rust/tarpaulin-report.json
          coverage-min: "0.90"
          notes: |
            - lib, integration and doc test counts are reported separately; cargo runs them as separate binaries and summing them hides which one broke.
            - Rust line coverage reads `unknown` because this job does not run cargo-tarpaulin. The 90% Rust gate is documented but not currently enforced anywhere in CI.

  java:
    name: java (mvn test, JDK 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # maven.test.failure.ignore lets `verify` reach jacoco when a test fails,
      # so a red run still reports its coverage number instead of reporting
      # nothing. Failing tests are counted from the surefire XML by the summary
      # step, which is what fails the job.
      - name: mvn verify
        id: verify
        continue-on-error: true
        run: mvn -B -q verify -Dmaven.test.failure.ignore=true

      - name: Run summary
        if: always()
        uses: submillisecond/subms-actions/scripts/ci-summary@main
        with:
          title: "subms - Java (JDK 21)"
          gates: |
            mvn verify (compile + jacoco check)=${{ steps.verify.outcome }}
          surefire-dirs: |
            java=java/target/surefire-reports
          jacoco-xml: |
            java (jacoco)=java/target/site/jacoco/jacoco.xml
          coverage-min: "0.90"
          notes: |
            - Test counts and failure messages are read from `java/target/surefire-reports/*.xml`, not from mvn's stdout, so `-q` does not hide them.
            - The jacoco 0.90 line-coverage floor is enforced by `jacoco:check` inside `verify`; the row above reports the same number the gate uses.
